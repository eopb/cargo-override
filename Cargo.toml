[package]
name = "cargo-override"
version = "0.0.8"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0 OR MIT"
description = """
Quickly override dependencies using the `[patch]` section of `Cargo.toml`s.
"""
repository = "https://github.com/eopb/cargo-override"

[features]
# Used to introduce TDD style tests, that are known to fail now, without breaking CI.
#
# These tests are marked with `#[cfg_attr(not(feature = "failing_tests"), should_panic)]`.
# Once the bugs are fixed, and these tests start passing, those attributes need to be
# removed.
#
# You can run these special tests now with `cargo test --features failing_tests`
failing_tests = []

[dependencies]
anyhow = "1.0.100"
camino = "1.2.1"
cargo = "0.93.0"
cargo_metadata = "0.23"
cargo-util-schemas = "0.10.2"
clap = { version = "4.5.56", features = ["derive"] }
fs-err = "3.2.0"
home = "0.5.12"
pathdiff = "0.2.3"
semver = "1.0.27"
serde = { version = "1.0.219", features = ["derive"] }
toml_edit = "0.24.0"
url = "2.5.4"
winnow = "0.7.14"
clap-cargo = "0.18.3"

[dev-dependencies]
assert_cmd = "2.1.2"
fake = "4.4.0"
googletest = "0.14.2"
hex = "0.4.3"
insta = { version = "1.46.2", features = ["filters", "toml"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
strip-ansi-escapes = "0.2.1"
tempfile = "3.23.0"
test-case = "3.3.1"

# Faster snapshotting https://insta.rs/docs/quickstart/#optional-faster-runs
[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
